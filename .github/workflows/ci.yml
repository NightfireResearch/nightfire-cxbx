name: CI

# Pushes to any branch, and pull requests - the latter so that a PR from a fork is built too, which a push
# trigger alone never sees. A PR from a branch in this repository is therefore built twice; if that becomes
# annoying, restrict the push trigger to the default branch rather than dropping either one.
on:
  push:
  pull_request:

jobs:
  # The native build, with MSVC. Pinned to the 2022 generator to match the runner image; the game is a
  # 32-bit x86 binary and the loader has to share its address space, so Win32 is not a choice. Both of
  # those live in CMakePresets.json now, so this runs the same two commands the README gives a person.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # With the launcher (src/launcher), which adds SDL3's static library to the build
      - name: Configure
        run: cmake --preset windows -DNIGHTFIRE_LAUNCHER=ON

      - name: Build
        run: cmake --build --preset windows

      # The release job's tools (.github/workflows/release.yml) on this build, signed with the test key: the zip, the
      # manifest, the signature and its check
      - name: Release tools, a dry run
        shell: bash
        run: |
          python tools/release/ed25519.py
          python tools/release/package.py zip --platform windows-x86 --version 0.0.0-ci --build build/windows/Release --out dist
          python tools/release/package.py manifest --version 0.0.0-ci --out dist/manifest.json dist/*.zip
          python tools/release/sign_manifest.py sign dist/manifest.json --test-key
          python tools/release/sign_manifest.py verify dist/manifest.json --test-key

      # action.exe only works because it is the image at the XBE's base address - linked at 0x10000, large
      # enough to span the XBE, with ASLR off, and with its own code above the XBE's end. Those are link
      # options, and losing one of them fails at runtime rather than at build time, so without this a broken
      # loader would be published happily.
      - name: Check the loader was linked correctly
        run: python tools/check_loader_image.py build/windows/Release/action.exe

      # The same loader, linked the same way, carrying Driving.xbe. That XBE is the smaller of the two, so
      # the default size check (the action engine's) is the stricter one and needs no argument.
      - name: Check the driving loader was linked correctly
        run: python tools/check_loader_image.py build/windows/Release/driving.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nightfire-cxbx-Release
          path: build/windows/Release

  # The cross build: clang with the mingw-w64 sysroot, producing the same Windows binaries from macOS. It
  # is here to keep that path working rather than to ship from - see docs/macos-build.md for what differs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the cross toolchain
        run: brew install mingw-w64 ninja

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos

      - name: Check the loader was linked correctly
        run: python3 tools/check_loader_image.py build/macos/action.exe

      - name: Check the driving loader was linked correctly
        run: python3 tools/check_loader_image.py build/macos/driving.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nightfire-cxbx-macos-cross
          path: |
            build/macos/action.exe
            build/macos/driving.exe
            build/macos/actioninject.dll
            build/macos/drivinginject.dll
            build/macos/av*.dll
            build/macos/FFmpeg-*.txt

  # The standalone driving and action engines as native Apple Silicon programs (docs/driving/macos.md): the macos-arm64 preset,
  # SDL's GPU API on Metal. FFmpeg's shared libraries are built from the third_party/ffmpeg submodule
  # (tools/fmv/build_ffmpeg.sh macos-arm64) and cached by its commit. The game itself needs the disc, so it is built
  # and checked, not run.
  macos-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: FFmpeg's commit
        id: ffmpeg
        run: echo "commit=$(git rev-parse HEAD:third_party/ffmpeg)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg-arm64/lib
          key: ffmpeg-macos-arm64-${{ steps.ffmpeg.outputs.commit }}-${{ hashFiles('tools/fmv/build_ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/ffmpeg
          JOBS=$(sysctl -n hw.ncpu) sh tools/fmv/build_ffmpeg.sh macos-arm64 ~/ffmpeg-arm64

      - name: Configure
        run: cmake --preset macos-arm64 -DNF_FFMPEG_LIB_DIR=$HOME/ffmpeg-arm64/lib

      - name: Build
        run: >
          cmake --build --preset macos-arm64
          --target driving_standalone driving_standalone_test action_standalone action_standalone_test
          gamewindow_test spirvmsl mslcompile

      # The game window at 4 GB (macos.md 2): the image, the heaps, the pages and a thread's stack inside it, and the
      # file structures' 32-bit layouts
      - name: Check the game window
        run: build/macos-arm64/gamewindow_test 200000

      # arm64 always has FMA, and clang would fuse a * b + c unless told not to (macos.md 4)
      - name: Check for fused multiply-adds
        run: >
          tools/fused_ops.sh build/macos-arm64/driving_standalone build/macos-arm64/driving_standalone_test
          build/macos-arm64/action_standalone build/macos-arm64/action_standalone_test

      - uses: actions/upload-artifact@v7
        with:
          name: nightfire-driving-macos-arm64
          path: |
            build/macos-arm64/driving_standalone
            build/macos-arm64/driving_standalone_test
            build/macos-arm64/action_standalone
            build/macos-arm64/action_standalone_test
            build/macos-arm64/*.dylib
            build/macos-arm64/FFmpeg-*.txt

  # The same cross build from Linux, with the distribution's mingw-w64 in place of Homebrew's. The toolchain
  # file is shared with macOS and finds the /usr sysroot by itself. Pinned to 26.04 because the build needs
  # mingw-w64 13 or later for x3daudio.h, and ubuntu-latest is still 24.04, whose mingw-w64 is 11.
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # g++-mingw-w64-i686 rather than just the headers and CRT: the build links libstdc++ and libgcc
      # statically, and those come with the GCC cross compiler. It pulls in binutils-mingw-w64-i686 for
      # i686-w64-mingw32-ld and -windres.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang g++-mingw-w64-i686 ninja-build

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Check the loader was linked correctly
        run: python3 tools/check_loader_image.py build/linux/action.exe

      - name: Check the driving loader was linked correctly
        run: python3 tools/check_loader_image.py build/linux/driving.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nightfire-cxbx-linux-cross
          path: |
            build/linux/action.exe
            build/linux/driving.exe
            build/linux/actioninject.dll
            build/linux/drivinginject.dll
            build/linux/av*.dll
            build/linux/FFmpeg-*.txt

  # The 64-bit standalone driving engine's burn-down (docs/driving/64-bit.md): its sources compiled for x86-64 with
  # clang and the x86-64 mingw-w64 headers, syntax only, and the distinct error lines counted into the job summary.
  # A report rather than a gate until the count reaches 0 and the windows-x64 preset links.
  probe64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang and the x86-64 mingw-w64 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang g++-mingw-w64-x86-64

      - name: Generate the injection tables and layouts
        run: python3 tools/preprocess.py

      - name: Compile the standalone sources for x86-64
        run: |
          python3 tools/pointer_layout_audit.py --probe-script > probe.sh
          python3 tools/pointer_layout_audit.py --sources > sources.txt
          JOBS=4 sh probe.sh out64 < sources.txt
          python3 tools/pointer_layout_audit.py --probe-count out64 | tee -a "$GITHUB_STEP_SUMMARY"
