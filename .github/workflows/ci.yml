name: CI

# Pushes to any branch, and pull requests - the latter so that a PR from a fork is built too, which a push
# trigger alone never sees. A PR from a branch in this repository is therefore built twice; if that becomes
# annoying, restrict the push trigger to the default branch rather than dropping either one.
on:
  push:
  pull_request:

jobs:
  # The native build, with MSVC. Pinned to the 2022 generator to match the runner image; the game is a
  # 32-bit x86 binary and the loader has to share its address space, so Win32 is not a choice. Both of
  # those live in CMakePresets.json now, so this runs the same two commands the README gives a person.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows

      - name: Build
        run: cmake --build --preset windows

      # action.exe only works because it is the image at the XBE's base address - linked at 0x10000, large
      # enough to span the XBE, with ASLR off, and with its own code above the XBE's end. Those are link
      # options, and losing one of them fails at runtime rather than at build time, so without this a broken
      # loader would be published happily.
      - name: Check the loader was linked correctly
        run: python tools/check_loader_image.py build/windows/Release/action.exe

      - uses: actions/upload-artifact@v4
        with:
          name: nightfire-cxbx-Release
          path: build/windows/Release

  # The cross build: clang with the mingw-w64 sysroot, producing the same Windows binaries from macOS. It
  # is here to keep that path working rather than to ship from - see docs/macos-build.md for what differs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: brew install mingw-w64 ninja

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos

      - name: Check the loader was linked correctly
        run: python3 tools/check_loader_image.py build/macos/action.exe

      - uses: actions/upload-artifact@v4
        with:
          name: nightfire-cxbx-macos-cross
          path: |
            build/macos/action.exe
            build/macos/actioninject.dll
            build/macos/drivinginject.dll
            build/macos/action_cxbx.exe
            build/macos/driving_cxbx.exe
