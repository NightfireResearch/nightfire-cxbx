name: CI

on: push

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Build Folder
        run: |
          cmake -E make_directory ${{ runner.workspace }}/build

      # Pinned to the 2022 generator to match the runner image above. The game is a 32-bit x86 binary and the
      # loader has to share its address space, so Win32 is not a choice.
      - name: Configure CMake
        shell: bash
        working-directory: ${{ runner.workspace }}/build
        run: |
          cmake $GITHUB_WORKSPACE -G "Visual Studio 17 2022" -A Win32

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: |
          cmake --build . --config Release

      # action.exe only works because it is the image at the XBE's base address - linked at 0x10000, large
      # enough to span the XBE, with ASLR off. Those are link options, and losing one of them fails at
      # runtime rather than at build time, so without this a broken loader would be published happily.
      - name: Check the loader was linked correctly
        shell: pwsh
        run: |
          ./tools/check_loader_image.ps1 -Exe "${{ runner.workspace }}/build/Release/action.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightfire-cxbx-Release
          path: ${{ runner.workspace }}/build/Release
